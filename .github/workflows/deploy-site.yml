name: Trigger Quartz Deploy

on:
  push:
    branches:
      - main

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger llm-atlas-site build
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.SITE_TRIGGER_TOKEN }}" \
          https://api.github.com/repos/yangmiaowei/llm-atlas-site/dispatches \
          -d '{"event_type":"llm-atlas-update"}'